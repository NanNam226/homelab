---
services:
  joplin_db:
    image: postgres:16
    profiles: [apps, utils, always, all]
    volumes: 
      - joplin_db_data:/var/lib/postgresql/data
    networks: 
      - joplin_network
    # (Optional): Allow accessing the database using an external tool (e.g. `psql`) from the host:
    ports: 
      - 5432:5432
    restart: unless-stopped
    environment:
      - POSTGRES_USER=joplin_db
      - POSTGRES_PASSWORD=${JOPLIN_POSTGRES_PASSWORD}
      - POSTGRES_DB=joplin_db

  joplin:
    image: joplin/server:latest
    profiles: [apps, utils, always, all]
    networks: 
      - joplin_network
      - traefik_public
    depends_on:
      - joplin_db
      # - transcribe
    ports:
      - 22300:22300
    restart: unless-stopped
    environment:
      - TZ=${TZ:-Europe/Copenhagen}
      - APP_PORT=22300
      - APP_BASE_URL=https://joplin.${DOMAIN:-traefik.me}
      - DB_CLIENT=pg
      - POSTGRES_USER=joplin_db
      - POSTGRES_PASSWORD=${JOPLIN_POSTGRES_PASSWORD}
      - POSTGRES_DATABASE=joplin_db
      - POSTGRES_HOST=joplin_db
      - POSTGRES_PORT=5432
      # - TRANSCRIBE_API_KEY=${TRANSCRIBE_API_KEY}
      # - TRANSCRIBE_BASE_URL=http://transcribe:4567
      # - TRANSCRIBE_ENABLED=${TRANSCRIBE_ENABLED}
    labels:
      - sablier.enable=true
      - sablier.group=joplin
      - homepage.group=Utilities
      - homepage.name=joplin
      - homepage.icon=mdi-package-variant-closed
      - homepage.href=https://joplin.${DOMAIN:-traefik.me}
      - homepage.description=Synchronization backend for the Joplin markdown notes app.

