  joplin_network:
    enable_ipv6: false
    driver_opts:
      com.docker.network.driver.mtu: "1400"
  # transcribe_network:
  traefik_public:
    name: traefik_public
    driver: bridge
    attachable: true

volumes:
  joplin_db_data:
