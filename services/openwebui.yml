---
services:
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    profiles: [apps, ai, all]
    networks: ["traefik_public"]
    volumes: 
      - open-webui:/app/backend/data
      # - ${DOCKHAND_STACK_DIR:-..}/config/openwebui:/app/backend/open_webui:rw
    # depends_on:
    #   traefik:
    #     condition: service_healthy
    ports: [3030:8080]
    # environment:
    #   # Change this to any secret key to use as your OpenAI compatible API key
    #   - KW_SECRET_API_KEY=${OPENWEBUI_API_KEY:?Set OPENWEBUI_API_KEY in .env, direnv,or Dockhand}
    #   - TZ=${TZ:-Europe/Copenhagen}
    labels:
      - sablier.enable=true
      - sablier.group=openwebui
      - homepage.group=Utilities
      - homepage.name=OpenWebUI
      - homepage.icon=open-webui.png
      - homepage.href=https://openwebui.${DOMAIN:-traefik.me}
      - homepage.description=Chatbot interface
#     deploy:
#       resources:
#         limits:
#           cpus: '0.5'
#           memory: 512M
#         reservations:
#           cpus: '0.25'
#           memory: 256M
    restart: unless-stopped
  pipelines:
    image: 'ghcr.io/open-webui/pipelines:main'
    profiles: [apps, ai, all]
    networks: ["traefik_public"]
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
    volumes:
      - 'pipelines:/app/pipelines'
    ports:
      - 9099:9099
    labels:
      - sablier.enable=true
      - sablier.group=pipelines
      - homepage.group=Utilities
      - homepage.name=Pipelines
      - homepage.icon=pipelines.png
      - homepage.href=https://pipelines.${DOMAIN:-traefik.me}
      - homepage.description=Workflow plugin for OpenWebUI
networks:
  traefik_public:
    name: traefik_public
    driver: bridge
    attachable: true
volumes:
  open-webui:
  pipelines: