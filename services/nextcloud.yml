---
services:
  nextcloud:
    profiles: [apps, all]
    image: lscr.io/linuxserver/nextcloud:latest
    networks: ["traefik_public"]
    restart: unless-stopped
    volumes:
      - nextcloud_config:/config
      - nextcloud_data:/data
    environment:
      - PUID=568
      - PGID=568
      - TZ=${TZ:-Europe/Copenhagen}
    ports:
      - 8887:443
    # devices: ["/dev/dri"] # Uncomment to enable hardware acceleration. ⚠️⚠️⚠️ Warning: this only works if the '/dev/dri' device is present on the host! If it should not exist on your host, don't add this as otherwise the mastercontainer will fail to start! See https://github.com/nextcloud/all-in-one#how-to-enable-hardware-acceleration-for-nextcloud
    labels:
      - sablier.enable=true
      - sablier.group=nextcloud
      # - traefik.enable=true
      # - traefik.docker.network=traefik_public
      # - traefik.http.routers.nextcloud.rule=Host(`nextcloud.${DOMAIN:-traefik.me}`)
      # - traefik.http.routers.nextcloud.entrypoints=websecure
      # - traefik.http.routers.nextcloud.middlewares=startup-retry@file
      # - traefik.http.routers.nextcloud.service=nextcloud
      # - traefik.http.services.nextcloud.loadbalancer.server.port=8443
      - homepage.group=Utilities
      - homepage.name=NextCloud
      - homepage.icon=nextcloud.png
      - homepage.href=https://nextcloud.${DOMAIN:-traefik.me}
      - homepage.description=Office & file management

volumes:
  nextcloud_config:
  nextcloud_data:

networks:
  traefik_public:
    name: traefik_public
    driver: bridge
    attachable: true
    driver_opts:
      com.docker.network.driver.mtu: "1400"



