services:
  hbbs:
    container_name: hbbs
    image: rustdesk/rustdesk-server:latest
    profiles = ['all','apps']
    command: hbbs
    volumes:
      - ./data:/root
    network_mode: "host"

    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    image: rustdesk/rustdesk-server:latest
    profiles: [all, apps]
    command: hbbr
    volumes:
      - ./data:/root
    network_mode: "host"
    restart: unless-stopped